name: build

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master
    tags:
      - '*'
    paths-ignore:
      - LICENSE
      - README.MD
  pull_request:
    branches:
      - main
      - master
    paths-ignore:
      - LICENSE
      - README.MD
  schedule:
    - cron: '30 03 01 */3 *' # Artifacts expire every 3 months

jobs:
  build:
    name: build with mms${{ matrix.mm_version }} on ${{ matrix.os_short }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          # Pinned on purpose: Linux binaries require the build host's glibc (or older),
          # so building on 24.04 (glibc 2.39) keeps them loadable on Ubuntu 24.04+.
          - ubuntu-24.04
          - windows-latest

        sm_version:
          - "master"

        mm_version:
          - "1.12"

        include:
          - mm_version: "1.12"
            mm_branch: "1.12-dev"

          - sm_version: "master"
            sm_branch: "master"

          - os: ubuntu-24.04
            os_short: linux

          - os: windows-latest
            os_short: win

    steps:
      - name: Prepare env
        shell: bash
        run: |
          echo "GITHUB_SHA_SHORT=${GITHUB_SHA::7}" >> $GITHUB_ENV

      - name: Install (Linux)
        if: startsWith(runner.os, 'Linux')
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          # clang >= 19 is required: the upstream l4d2 hl2sdk manifest passes -Wno-nontrivial-memcall,
          # which the default clang 18 on Ubuntu 24.04 rejects (-Werror,-Wunknown-warning-option).
          sudo apt-get install -y clang-19 g++-multilib
          echo "CC=clang-19" >> $GITHUB_ENV
          echo "CXX=clang++-19" >> $GITHUB_ENV

      - name: Checking out SourceMod
        uses: actions/checkout@v7
        with:
          repository: alliedmodders/sourcemod
          ref: ${{ matrix.sm_branch }}
          path: sourcemod-${{ matrix.sm_version }}
          submodules: recursive

      - name: Checking out MM:Source
        uses: actions/checkout@v7
        with:
          repository: alliedmodders/metamod-source
          ref: ${{ matrix.mm_branch }}
          path: metamod-${{ matrix.mm_version }}

      - name: Setting up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Setting up ambuild
        run: |
          python -m pip install wheel
          pip install git+https://github.com/accelerator74/ambuild@nog3

      - name: Checking out hl2sdk-l4d
        uses: actions/checkout@v7
        with:
          repository: alliedmodders/hl2sdk
          ref: l4d
          path: hl2sdk-l4d

      - name: Checking out hl2sdk-l4d2
        uses: actions/checkout@v7
        with:
          repository: alliedmodders/hl2sdk
          ref: l4d2
          path: hl2sdk-l4d2

      - name: Checking out hl2sdk-manifests
        uses: actions/checkout@v7
        with:
          repository: alliedmodders/hl2sdk-manifests
          path: hl2sdk-manifests

      - name: Checking out own repository
        uses: actions/checkout@v7
        with:
          path: src

      - name: Compiling ${{ github.event.repository.name }}-l4d files
        working-directory: src
        run: |
          mkdir build_l4d
          cd build_l4d
          python ../configure.py --enable-optimize --sdks="l4d" --sm-path="${{ github.workspace }}/sourcemod-${{ matrix.sm_version }}" --hl2sdk-manifest-path="${{ github.workspace }}/hl2sdk-manifests" --mms-path="${{ github.workspace }}/metamod-${{ matrix.mm_version }}"
          ambuild

      - name: Compiling ${{ github.event.repository.name }}-l4d2 files
        working-directory: src
        run: |
          mkdir build_l4d2
          cd build_l4d2
          python ../configure.py --enable-optimize --sdks="l4d2" --sm-path="${{ github.workspace }}/sourcemod-${{ matrix.sm_version }}" --hl2sdk-manifest-path="${{ github.workspace }}/hl2sdk-manifests" --mms-path="${{ github.workspace }}/metamod-${{ matrix.mm_version }}"
          ambuild

      - name: Verifying Linux binaries
        if: startsWith(runner.os, 'Linux')
        working-directory: src
        env:
          MAX_GLIBC: "2.39" # Ubuntu 24.04
        run: bash .github/verify_linux_so.sh build_l4d/package/addons/tickrate_enabler/tickrate_enabler.so build_l4d2/package/addons/tickrate_enabler/tickrate_enabler.so

      - name: Uploading l4d package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-l4d-${{ matrix.os_short }}-${{ env.GITHUB_SHA_SHORT }}
          path: src/build_l4d/package

      - name: Uploading l4d2 package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ github.event.repository.name }}-l4d2-${{ matrix.os_short }}-${{ env.GITHUB_SHA_SHORT }}
          path: src/build_l4d2/package

  release:
    name: Release
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write # required to create the release / upload assets

    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v8

      - name: Package
        run: |
          version=`echo $GITHUB_REF | sed "s/refs\/tags\///"`
          ls -Rall
          for folder in ${{ github.event.repository.name }}*; do
            if [ -d "$folder" ]; then
              echo "Processing folder: $folder"
              cd $folder
              tar -czf ../$folder.tar.gz -T <(\ls -1)
              cd ..
            fi
          done

      - name: Release
        uses: svenstaro/upload-release-action@v2
        with:
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: '*.tar.gz'
          tag: ${{ github.ref }}
          file_glob: true
